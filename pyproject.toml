[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "19flavorbr-textnorm"
version = "0.1.0"
description = "文本转换体检，往返一致性是唯一验收标准"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "19flavorbr" }]
keywords = ["text", "encoding", "normalization", "unicode"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/19flavorbr/textnorm"
Repository = "https://github.com/19flavorbr/textnorm"
Issues = "https://github.com/19flavorbr/textnorm/issues"

[project.scripts]
textnorm = "textnorm:main"

[tool.setuptools]
py-modules = ["textnorm"]
